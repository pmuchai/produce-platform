<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awaiting approval | Prime Root</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/assets/prime-root-mark.svg}">
  <link rel="stylesheet" th:href="@{/assets/app.css}">
</head>
<body>
<main class="access-status">
  <section class="panel">
    <a class="brand" th:href="@{/}"><img class="brand-mark" th:src="@{/assets/prime-root-mark.svg}" width="44" height="44" alt="">Prime Root</a>
    <p class="eyebrow">YOUR FRESH PRODUCE DISTRIBUTION NETWORK</p>
    <h1>Awaiting administrator approval</h1>
    <form th:action="@{/oauth2/authorization/keycloak}" method="get">
      <input type="hidden" name="prompt" value="login">
      <button type="submit">Check approval and sign in</button>
    </form>
  </section>
</main>
</body>
</html>
