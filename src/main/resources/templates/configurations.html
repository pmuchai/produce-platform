<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Configurations')}"></head>
<body>
<a class="skip" href="#main">Skip to content</a><aside th:replace="~{layout :: sidebar}"></aside>
<main id="main" class="workspace">
  <header th:replace="~{layout :: header('Configurations', 'Business master data and access foundations')}"></header>
  <div class="grid">
    <section class="card" th:if="${canCatalogue}"><h2><svg th:replace="~{layout :: icon('leaf')}"></svg>Catalogue and units</h2><a th:href="@{/ui/catalogue}">Manage catalogue</a></section>
    <section class="card" th:if="${canBranches}"><h2><svg th:replace="~{layout :: icon('box')}"></svg>Branches</h2><a th:href="@{/ui/branches}">Branches</a></section>
    <section class="card"><h2><svg th:replace="~{layout :: icon('users')}"></svg>Roles and credentials</h2><p>Managed in Keycloak.</p></section>
    <section class="card" th:unless="${canCatalogue or canBranches}"><h2>No configuration access</h2><p>Ask your administrator for the appropriate view permissions.</p></section>
  </div>
</main>
</body>
</html>
