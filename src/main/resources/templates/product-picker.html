<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="picker(products, mode)" class="product-picker" th:attr="data-entry-mode=${mode}">
  <label class="product-search"><svg th:replace="~{layout :: icon('search')}"></svg>
    <span class="sr-only">Search products</span><input type="search" id="product-search" placeholder="Search products..." autocomplete="off">
  </label>
  <div class="product-filters" aria-label="Product categories"><button type="button" class="selected" data-product-filter="" aria-pressed="true">All products</button></div>
  <div class="product-grid">
    <button th:each="product : ${products}" type="button" class="product-tile" data-add-product
      th:attr="data-id=${product.id},data-name=${product.name},data-type=${product.produceTypeId},data-category=${product.produceType},data-unit=${product.baseUnitId}">
      <span class="product-picture"><svg class="product-art" aria-hidden="true" viewBox="0 0 96 80"><use th:href="@{/assets/icons.svg} + '#produce'"></use></svg></span>
      <span class="product-name" th:text="${mode == 'sale' ? product.label : product.code + ' / ' + product.name}"></span>
      <span class="product-stock" th:if="${mode == 'sale'}" th:text="'On hand: ' + ${product.quantity.stripTrailingZeros().toPlainString()} + ' ' + ${product.baseUnit}"></span>
      <span class="product-stock" th:unless="${mode == 'sale'}" th:text="${product.baseUnit}"></span>
      <span class="tile-add"><svg th:replace="~{layout :: icon('plus')}"></svg><span class="sr-only">Add product</span></span>
    </button>
  </div>
  <p id="product-empty" class="empty-state" th:hidden="${!products.isEmpty()}">No matching products.</p>
</section>
</body>
</html>
